<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You — AWHI Yoga School</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ao:       #2A2320;
      --hua:      #F4EFE4;
      --wai:      #C05C2C;
      --kawakawa: #7A9E7E;
      --kowhai:   #D4A553;
      --ngahere:  #1C3829;

      --font-display: 'Cormorant', Georgia, serif;
      --font-body:    'DM Sans', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: var(--font-body);
      background: var(--ngahere);
      color: var(--hua);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }

    .wordmark {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(244,239,228,0.5);
      margin-bottom: 3rem;
    }

    .check {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1.5px solid var(--kawakawa);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      color: var(--kawakawa);
    }
    .check svg { width: 24px; height: 24px; }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      font-weight: 600;
      line-height: 1.1;
      margin-bottom: 1.25rem;
      max-width: 18ch;
      text-wrap: balance;
    }

    .message {
      font-size: clamp(1rem, 2vw, 1.15rem);
      color: rgba(244,239,228,0.75);
      line-height: 1.75;
      max-width: 44ch;
      margin-bottom: 2.5rem;
    }

    .divider {
      width: 2rem;
      height: 1.5px;
      background: var(--kawakawa);
      margin: 0 auto 2.5rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(244,239,228,0.45);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--hua); }
    .back-link::before { content: '←'; }
  </style>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WMH30J5X50"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date()); gtag('config', 'G-WMH30J5X50');
  </script>
</head>
<body>

  <p class="wordmark">AWHI Yoga School</p>

  <div class="check" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>

  <h1>Ngā mihi nui</h1>

  <div class="divider"></div>

  <p class="message">Thank you for your interest in our 300-hour Yoga Teacher Training. We will be in touch with you soon.</p>

  <a href="300hr.html" class="back-link">Back to 300hr YTT</a>

</body>
</html>
